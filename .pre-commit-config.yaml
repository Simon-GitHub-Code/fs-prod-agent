default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: verify
        name: fitness suite
        entry: scripts/verify
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: secrets
        name: secret scan
        entry: scripts/secrets
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
